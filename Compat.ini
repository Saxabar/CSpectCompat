; CSpect Compat: fixes for the games CSpect loads (.nex, .snx, .sna), found by the MD5 of the file.
; Put this file next to Compat.dll. It is not used when CSPECT_COMPAT is set (e.g. by CSpect Launcher).
;
;   <MD5 of the file>=<options, comma-separated>
;
; CSpect's console shows the MD5 of each file it loads ("Compat: <file> MD5 ..."), or on Windows:
;   certutil -hashfile <file> MD5
; Options: l2bank9, nodivmmc, dd01nop, zeroram, divfirst, im2ff, sdstream, divnmi (see README.md).
;
; default= : options for every other file, and for games started from NextZXOS (CSpect has loaded the SD
; card image, not the game). For the games below that need them, e.g. default=divfirst,im2ff,sdstream:
;   4K Race Next (divfirst,im2ff), Manic Miner Trick Or Treat AY (im2ff), Space Racing (im2ff),
;   The Way of the Exploding Fist (sdstream: needs NextZXOS; the music is read from the game's folder,
;   which must be CSpect's current folder without CSPECT_COMPAT_FILE)
default=

; Montana Mike (MontanaMike.snx / MontanaMike.sna)
4d94f98ab1ee9e3bdf879c5599f78a36=l2bank9

; Dweebs Drop (DweebsDrop.snx / DweebsDrop.sna)
7e96dc89ffb41310eed2bb32e8fab82a=l2bank9

; Deltas Shadow (DeltasShadow.snx)
03385b1946d6dde44e0f0d04103ae918=nodivmmc

; Spice Invaderz (spiceinv.snx)
5ca82daa919db158562405e19dad4500=zeroram

; Atic Atac Next (ATICATAC.NEX)
d0f9bd2b90329d8f229388d9ce2941f3=divnmi
